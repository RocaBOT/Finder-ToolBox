name: Git Mtime Cache
description: Set mtimes of tracked files to match their last commit time.
runs:
  using: "composite"
  steps:
    - run: |
        run: python3 ${{github.action_path}}/git-restore-mtime
      shell: bash
    - run: |
        run: git submodule foreach --recursive 'python3 "${{github.action_path}}/git-restore-mtime"'
      shell: bash
